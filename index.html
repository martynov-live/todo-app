<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои задачи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --page-bg: #f7f7f5;
      --border: #e9e9e7;
      --border-hover: #d3d3d0;
      --text: #37352f;
      --text-secondary: #9b9a97;
      --text-placeholder: #c2c1be;
      --done-text: #9b9a97;
      --accent: #2383e2;
      --accent-light: #e7f0fc;
      --danger: #eb5757;
      --danger-light: #fde8e8;
      --hover-bg: #f1f1ef;
      --check-done: #37352f;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0 16px 80px;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 700px;
      background: var(--bg);
      min-height: 100vh;
      padding: 0;
    }

    /* Cover area */
    .cover {
      height: 160px;
      background: linear-gradient(135deg, #e8f4fd 0%, #eef2ff 100%);
    }

    /* Page header */
    .page-header {
      padding: 24px 56px 0;
    }

    .page-icon {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 12px;
      margin-top: -36px;
      display: block;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .page-meta {
      color: var(--text-secondary);
      font-size: 0.82rem;
      margin-bottom: 32px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 56px 28px;
    }

    /* Content area */
    .content {
      padding: 0 56px;
    }

    /* Stats row */
    .stats-row {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-hover);
      flex-shrink: 0;
    }

    .stat-dot.active { background: var(--accent); }
    .stat-dot.done { background: var(--check-done); }

    .stat-count {
      font-weight: 600;
      color: var(--text);
    }

    /* Progress */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--check-done);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .progress-pct {
      font-size: 0.78rem;
      color: var(--text-secondary);
      min-width: 32px;
      text-align: right;
    }

    /* Add task input */
    .add-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      cursor: text;
      transition: background 0.15s;
    }

    .add-row:hover { background: var(--hover-bg); }

    .add-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1.5px dashed var(--text-placeholder);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-placeholder);
      font-size: 14px;
      font-weight: 400;
      line-height: 1;
    }

    .add-row input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.93rem;
      color: var(--text);
      caret-color: var(--accent);
    }

    .add-row input::placeholder { color: var(--text-placeholder); }

    /* Filter tabs */
    .filters {
      display: flex;
      gap: 2px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .filter-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 8px 12px 9px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .filter-btn.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .filter-btn:hover:not(.active) { color: var(--text); }

    /* Task list */
    .task-list {
      display: flex;
      flex-direction: column;
      margin-top: 4px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 5px 10px;
      border-radius: 4px;
      transition: background 0.12s;
      animation: fadeSlide 0.18s ease;
      position: relative;
    }

    .task-item:hover { background: var(--hover-bg); }
    .task-item.done { opacity: 0.7; }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }

    /* Checkbox */
    .check-wrap {
      flex-shrink: 0;
      margin-top: 2px;
    }

    .check-wrap input[type="checkbox"] { display: none; }

    .check-wrap label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1.5px solid var(--border-hover);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }

    .check-wrap label::after {
      content: '';
      display: block;
      width: 10px;
      height: 7px;
      border-left: 2px solid transparent;
      border-bottom: 2px solid transparent;
      transform: rotate(-45deg) translate(1px, -1px);
      transition: border-color 0.12s;
    }

    .check-wrap input:checked + label {
      background: var(--check-done);
      border-color: var(--check-done);
    }

    .check-wrap input:checked + label::after {
      border-left-color: #fff;
      border-bottom-color: #fff;
    }

    .check-wrap label:hover { border-color: var(--text-secondary); }

    /* Task text */
    .task-text {
      flex: 1;
      font-size: 0.93rem;
      line-height: 1.55;
      color: var(--text);
      word-break: break-word;
      transition: color 0.15s;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--done-text);
    }

    /* Delete button */
    .del-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--text-placeholder);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.12s, color 0.12s, background 0.12s;
      margin-top: 1px;
      line-height: 1;
    }

    .task-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { color: var(--danger); background: var(--danger-light); }

    /* Empty state */
    .empty {
      padding: 40px 0;
      text-align: center;
      color: var(--text-placeholder);
    }

    .empty-icon {
      font-size: 2rem;
      margin-bottom: 8px;
      opacity: 0.5;
    }

    .empty p {
      font-size: 0.85rem;
    }

    /* Clear done */
    .clear-btn {
      width: 100%;
      background: none;
      border: none;
      padding: 10px;
      color: var(--text-placeholder);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      border-radius: 4px;
      margin-top: 16px;
      transition: color 0.12s, background 0.12s;
    }

    .clear-btn:hover { color: var(--danger); background: var(--danger-light); }
    .clear-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

    /* Responsive */
    @media (max-width: 600px) {
      .page-header { padding: 20px 20px 0; }
      .content { padding: 0 20px; }
      .divider { margin: 0 20px 20px; }
      .page-title { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="cover"></div>

  <div class="page-header">
    <span class="page-icon">☑️</span>
    <h1 class="page-title">Мои задачи</h1>
    <div class="page-meta" id="page-meta">Загрузка...</div>
  </div>

  <div class="divider"></div>

  <div class="content">

    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-dot"></div>
        Всего: <span class="stat-count" id="stat-total">0</span>
      </div>
      <div class="stat-item">
        <div class="stat-dot active"></div>
        Активных: <span class="stat-count" id="stat-active">0</span>
      </div>
      <div class="stat-item">
        <div class="stat-dot done"></div>
        Выполнено: <span class="stat-count" id="stat-done">0</span>
      </div>
    </div>

    <div class="progress-row">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="done">Выполненные</button>
    </div>

    <div class="task-list" id="task-list"></div>

    <form id="add-form">
      <div class="add-row" id="add-row">
        <div class="add-icon">+</div>
        <input type="text" id="task-input" placeholder="Новая задача" maxlength="200" autocomplete="off" />
      </div>
    </form>

    <button class="clear-btn" id="clear-btn">↳ Удалить выполненные задачи</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo_tasks_notion_v1';
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';

  const listEl      = document.getElementById('task-list');
  const inputEl     = document.getElementById('task-input');
  const formEl      = document.getElementById('add-form');
  const addRow      = document.getElementById('add-row');
  const clearBtn    = document.getElementById('clear-btn');
  const filterBtns  = document.querySelectorAll('.filter-btn');
  const statTotal   = document.getElementById('stat-total');
  const statActive  = document.getElementById('stat-active');
  const statDone    = document.getElementById('stat-done');
  const progressFill = document.getElementById('progress-fill');
  const progressPct  = document.getElementById('progress-pct');
  const pageMeta     = document.getElementById('page-meta');

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  function updateMeta() {
    const now = new Date();
    const opts = { day: 'numeric', month: 'long', year: 'numeric' };
    pageMeta.textContent = now.toLocaleDateString('ru-RU', opts);
  }

  function updateStats() {
    const total  = tasks.length;
    const done   = tasks.filter(t => t.done).length;
    const active = total - done;
    const pct    = total ? Math.round((done / total) * 100) : 0;
    statTotal.textContent  = total;
    statActive.textContent = active;
    statDone.textContent   = done;
    progressFill.style.width = pct + '%';
    progressPct.textContent  = pct + '%';
    clearBtn.disabled = done === 0;
  }

  function getFiltered() {
    if (filter === 'active') return tasks.filter(t => !t.done);
    if (filter === 'done')   return tasks.filter(t =>  t.done);
    return tasks;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render() {
    const visible = getFiltered();
    listEl.innerHTML = '';

    if (visible.length === 0) {
      const msgs = {
        all:    ['📋', 'Нет задач. Добавьте первую выше.'],
        active: ['✓', 'Нет активных задач.'],
        done:   ['○', 'Нет выполненных задач.'],
      };
      const [ico, txt] = msgs[filter];
      listEl.innerHTML = `<div class="empty"><div class="empty-icon">${ico}</div><p>${txt}</p></div>`;
    } else {
      visible.forEach(task => {
        const div = document.createElement('div');
        div.className = 'task-item' + (task.done ? ' done' : '');
        div.dataset.id = task.id;
        div.innerHTML = `
          <div class="check-wrap">
            <input type="checkbox" id="cb-${task.id}" ${task.done ? 'checked' : ''} />
            <label for="cb-${task.id}"></label>
          </div>
          <span class="task-text">${escHtml(task.text)}</span>
          <button class="del-btn" title="Удалить">✕</button>
        `;
        div.querySelector('input[type="checkbox"]').addEventListener('change', () => toggle(task.id));
        div.querySelector('.del-btn').addEventListener('click', () => remove(task.id));
        listEl.appendChild(div);
      });
    }
    updateStats();
  }

  function add(text) {
    text = text.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now(), text, done: false });
    save();
    render();
  }

  function toggle(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function remove(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  formEl.addEventListener('submit', e => {
    e.preventDefault();
    add(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  addRow.addEventListener('click', () => inputEl.focus());

  clearBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  if (tasks.length === 0) {
    tasks = [
      { id: 3, text: 'Выпить стакан воды', done: true },
      { id: 2, text: 'Прочитать 20 страниц книги', done: false },
      { id: 1, text: 'Сделать зарядку', done: false },
    ];
    save();
  }

  updateMeta();
  render();
</script>
</body>
</html>
