<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои задачи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --page-bg: #f7f7f5;
      --border: #e9e9e7;
      --border-hover: #d3d3d0;
      --text: #37352f;
      --text-secondary: #9b9a97;
      --text-placeholder: #c2c1be;
      --done-text: #9b9a97;
      --accent: #2383e2;
      --accent-light: #e7f0fc;
      --danger: #eb5757;
      --danger-light: #fde8e8;
      --hover-bg: #f1f1ef;
      --check-done: #37352f;
      --orange: #d9730d;
      --orange-light: #fbecdd;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0 16px 80px;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: 700px;
      background: var(--bg);
      min-height: 100vh;
      padding: 0;
    }

    .cover {
      height: 160px;
      background: linear-gradient(135deg, #e8f4fd 0%, #eef2ff 100%);
    }

    .page-header {
      padding: 24px 56px 0;
    }

    .page-icon {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 12px;
      margin-top: -36px;
      display: block;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .page-meta {
      color: var(--text-secondary);
      font-size: 0.82rem;
      margin-bottom: 32px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 0 56px 28px;
    }

    .content {
      padding: 0 56px;
    }

    .stats-row {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border-hover);
      flex-shrink: 0;
    }

    .stat-dot.active { background: var(--accent); }
    .stat-dot.done   { background: var(--check-done); }

    .stat-count {
      font-weight: 600;
      color: var(--text);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .progress-bar {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--check-done);
      border-radius: 99px;
      transition: width 0.35s ease;
    }

    .progress-pct {
      font-size: 0.78rem;
      color: var(--text-secondary);
      min-width: 32px;
      text-align: right;
    }

    .add-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      cursor: text;
      transition: background 0.15s;
    }

    .add-row:hover { background: var(--hover-bg); }

    .add-icon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1.5px dashed var(--text-placeholder);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-placeholder);
      font-size: 14px;
      font-weight: 400;
      line-height: 1;
    }

    .add-row input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.93rem;
      color: var(--text);
      caret-color: var(--accent);
    }

    .add-row input::placeholder { color: var(--text-placeholder); }

    .filters {
      display: flex;
      gap: 2px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .filter-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      padding: 8px 12px 9px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .filter-btn.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .filter-btn:hover:not(.active) { color: var(--text); }

    .task-list {
      display: flex;
      flex-direction: column;
      margin-top: 4px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 10px;
      border-radius: 4px;
      transition: background 0.12s, box-shadow 0.12s;
      animation: fadeSlide 0.18s ease;
      position: relative;
    }

    .task-item:hover { background: var(--hover-bg); }
    .task-item.done  { opacity: 0.7; }

    /* Coloured left-edge accent for non-done urgent tasks */
    .task-item.is-overdue:not(.done) {
      box-shadow: inset 3px 0 0 rgba(235, 87, 87, 0.55);
    }
    .task-item.is-today:not(.done) {
      box-shadow: inset 3px 0 0 rgba(217, 115, 13, 0.55);
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }

    .check-wrap {
      flex-shrink: 0;
      margin-top: 0;
    }

    .check-wrap input[type="checkbox"] { display: none; }

    .check-wrap label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1.5px solid var(--border-hover);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }

    .check-wrap label::after {
      content: '';
      display: block;
      width: 10px;
      height: 7px;
      border-left: 2px solid transparent;
      border-bottom: 2px solid transparent;
      transform: rotate(-45deg) translate(1px, -1px);
      transition: border-color 0.12s;
    }

    .check-wrap input:checked + label {
      background: var(--check-done);
      border-color: var(--check-done);
    }

    .check-wrap input:checked + label::after {
      border-left-color: #fff;
      border-bottom-color: #fff;
    }

    .check-wrap label:hover { border-color: var(--text-secondary); }

    .task-text {
      flex: 1;
      font-size: 0.93rem;
      line-height: 1.55;
      color: var(--text);
      word-break: break-word;
      transition: color 0.15s;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--done-text);
    }

    /* ── Deadline button ── */
    .deadline-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: none;
      border: none;
      border-radius: 3px;
      padding: 2px 6px;
      font-family: inherit;
      font-size: 0.75rem;
      line-height: 1.4;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.12s, background 0.12s, color 0.12s;
    }

    /* No date — icon only, visible on row hover */
    .deadline-btn.no-date {
      color: var(--text-placeholder);
      opacity: 0;
    }
    .task-item:hover .deadline-btn.no-date { opacity: 1; }
    .deadline-btn.no-date:hover { background: var(--hover-bg); opacity: 1; }

    /* Date set states */
    .deadline-btn.future  { color: var(--text-secondary); background: var(--hover-bg); }
    .deadline-btn.future:hover  { background: var(--border-hover); }

    .deadline-btn.today-due { color: var(--orange); background: var(--orange-light); }
    .deadline-btn.today-due:hover { filter: brightness(0.93); }

    .deadline-btn.overdue   { color: var(--danger); background: var(--danger-light); }
    .deadline-btn.overdue:hover   { filter: brightness(0.93); }

    /* Delete button */
    .del-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--text-placeholder);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.12s, color 0.12s, background 0.12s;
      line-height: 1;
    }

    .task-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { color: var(--danger); background: var(--danger-light); }

    .empty {
      padding: 40px 0;
      text-align: center;
      color: var(--text-placeholder);
    }

    .empty-icon { font-size: 2rem; margin-bottom: 8px; opacity: 0.5; }
    .empty p { font-size: 0.85rem; }

    .clear-btn {
      width: 100%;
      background: none;
      border: none;
      padding: 10px;
      color: var(--text-placeholder);
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      border-radius: 4px;
      margin-top: 16px;
      transition: color 0.12s, background 0.12s;
    }

    .clear-btn:hover { color: var(--danger); background: var(--danger-light); }
    .clear-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

    /* ── Calendar popup ── */
    .cal-popup {
      position: fixed;
      z-index: 9999;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
      padding: 14px;
      width: 256px;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .cal-nav {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 1.1rem;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.12s, color 0.12s;
      line-height: 1;
      flex-shrink: 0;
    }
    .cal-nav:hover { background: var(--hover-bg); color: var(--text); }

    .cal-month-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
    }

    .cal-day-name {
      text-align: center;
      font-size: 0.68rem;
      color: var(--text-placeholder);
      padding: 4px 0 6px;
      font-weight: 500;
    }

    .cal-cell {
      text-align: center;
      font-size: 0.8rem;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text);
      transition: background 0.1s, color 0.1s;
    }

    .cal-cell:hover:not(.cal-other):not(.cal-selected) { background: var(--hover-bg); }
    .cal-cell.cal-other  { color: var(--text-placeholder); cursor: default; }
    .cal-cell.cal-other:hover { background: none; }
    .cal-cell.cal-today:not(.cal-selected)  { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .cal-cell.cal-selected {
      background: var(--text) !important;
      color: #fff !important;
      font-weight: 600;
    }

    .cal-footer {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
    }

    .cal-footer-hint {
      font-size: 0.72rem;
      color: var(--text-placeholder);
    }

    .cal-clear-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 3px 8px;
      border-radius: 4px;
      transition: background 0.12s, color 0.12s;
    }
    .cal-clear-btn:hover { background: var(--danger-light); color: var(--danger); }

    @media (max-width: 600px) {
      .page-header { padding: 20px 20px 0; }
      .content { padding: 0 20px; }
      .divider { margin: 0 20px 20px; }
      .page-title { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="cover"></div>

  <div class="page-header">
    <span class="page-icon">☑️</span>
    <h1 class="page-title">Мои задачи</h1>
    <div class="page-meta" id="page-meta">Загрузка...</div>
  </div>

  <div class="divider"></div>

  <div class="content">

    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-dot"></div>
        Всего: <span class="stat-count" id="stat-total">0</span>
      </div>
      <div class="stat-item">
        <div class="stat-dot active"></div>
        Активных: <span class="stat-count" id="stat-active">0</span>
      </div>
      <div class="stat-item">
        <div class="stat-dot done"></div>
        Выполнено: <span class="stat-count" id="stat-done">0</span>
      </div>
    </div>

    <div class="progress-row">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="done">Выполненные</button>
    </div>

    <div class="task-list" id="task-list"></div>

    <form id="add-form">
      <div class="add-row" id="add-row">
        <div class="add-icon">+</div>
        <input type="text" id="task-input" placeholder="Новая задача" maxlength="200" autocomplete="off" />
      </div>
    </form>

    <button class="clear-btn" id="clear-btn">↳ Удалить выполненные задачи</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo_tasks_notion_v1';
  let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';

  // Calendar state
  let calEl = null;
  let calTaskId = null;
  let calYear = 0;
  let calMonth = 0;

  const listEl       = document.getElementById('task-list');
  const inputEl      = document.getElementById('task-input');
  const formEl       = document.getElementById('add-form');
  const addRow       = document.getElementById('add-row');
  const clearBtn     = document.getElementById('clear-btn');
  const filterBtns   = document.querySelectorAll('.filter-btn');
  const statTotal    = document.getElementById('stat-total');
  const statActive   = document.getElementById('stat-active');
  const statDone     = document.getElementById('stat-done');
  const progressFill = document.getElementById('progress-fill');
  const progressPct  = document.getElementById('progress-pct');
  const pageMeta     = document.getElementById('page-meta');

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  // ── Date helpers ──────────────────────────────────────────────

  function toISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function todayISO() { return toISO(new Date()); }

  function deadlineStatus(ds) {
    if (!ds) return null;
    const t = todayISO();
    if (ds < t) return 'overdue';
    if (ds === t) return 'today-due';
    return 'future';
  }

  function fmtDate(ds) {
    const [y, m, d] = ds.split('-').map(Number);
    const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
    return y === new Date().getFullYear() ? `${d} ${months[m-1]}` : `${d} ${months[m-1]} ${y}`;
  }

  // ── Stats & meta ──────────────────────────────────────────────

  function updateMeta() {
    pageMeta.textContent = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function updateStats() {
    const total  = tasks.length;
    const done   = tasks.filter(t => t.done).length;
    const active = total - done;
    const pct    = total ? Math.round((done / total) * 100) : 0;
    statTotal.textContent  = total;
    statActive.textContent = active;
    statDone.textContent   = done;
    progressFill.style.width = pct + '%';
    progressPct.textContent  = pct + '%';
    clearBtn.disabled = done === 0;
  }

  // ── Render ────────────────────────────────────────────────────

  function getFiltered() {
    if (filter === 'active') return tasks.filter(t => !t.done);
    if (filter === 'done')   return tasks.filter(t =>  t.done);
    return tasks;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render() {
    closeCal();
    const visible = getFiltered();
    listEl.innerHTML = '';

    if (visible.length === 0) {
      const msgs = {
        all:    ['📋', 'Нет задач. Добавьте первую выше.'],
        active: ['✓',  'Нет активных задач.'],
        done:   ['○',  'Нет выполненных задач.'],
      };
      const [ico, txt] = msgs[filter];
      listEl.innerHTML = `<div class="empty"><div class="empty-icon">${ico}</div><p>${txt}</p></div>`;
    } else {
      visible.forEach(task => {
        const status = deadlineStatus(task.deadline);

        let cls = 'task-item';
        if (task.done) cls += ' done';
        if (!task.done && status === 'overdue')   cls += ' is-overdue';
        if (!task.done && status === 'today-due') cls += ' is-today';

        const dlLabel = task.deadline
          ? `📅 ${fmtDate(task.deadline)}`
          : '📅';
        const dlCls = task.deadline ? (status || 'future') : 'no-date';

        const div = document.createElement('div');
        div.className = cls;
        div.dataset.id = task.id;
        div.innerHTML = `
          <div class="check-wrap">
            <input type="checkbox" id="cb-${task.id}" ${task.done ? 'checked' : ''} />
            <label for="cb-${task.id}"></label>
          </div>
          <span class="task-text">${escHtml(task.text)}</span>
          <button class="deadline-btn ${dlCls}" title="Установить дедлайн">${dlLabel}</button>
          <button class="del-btn" title="Удалить">✕</button>
        `;

        div.querySelector('input[type="checkbox"]').addEventListener('change', () => toggle(task.id));
        div.querySelector('.del-btn').addEventListener('click', () => remove(task.id));
        div.querySelector('.deadline-btn').addEventListener('click', e => {
          e.stopPropagation();
          openCal(task.id, e.currentTarget);
        });

        listEl.appendChild(div);
      });
    }
    updateStats();
  }

  // ── CRUD ──────────────────────────────────────────────────────

  function add(text) {
    text = text.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now(), text, done: false, deadline: null });
    save();
    render();
  }

  function toggle(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function remove(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function setDeadline(id, ds) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.deadline = ds || null; save(); render(); }
  }

  // ── Calendar ──────────────────────────────────────────────────

  function openCal(taskId, anchorEl) {
    if (calEl && calTaskId === taskId) { closeCal(); return; }
    closeCal();

    calTaskId = taskId;
    const task = tasks.find(t => t.id === taskId);

    if (task?.deadline) {
      const [y, m] = task.deadline.split('-').map(Number);
      calYear = y; calMonth = m - 1;
    } else {
      const now = new Date();
      calYear = now.getFullYear(); calMonth = now.getMonth();
    }

    calEl = document.createElement('div');
    calEl.className = 'cal-popup';
    calEl.addEventListener('click', e => e.stopPropagation());
    document.body.appendChild(calEl);

    buildCal();
    positionCal(anchorEl);
  }

  function buildCal() {
    const task = tasks.find(t => t.id === calTaskId);
    const sel   = task?.deadline;
    const today = todayISO();

    const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    const DAYS   = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const firstDow    = (new Date(calYear, calMonth, 1).getDay() + 6) % 7; // Mon = 0
    const prevTotal   = new Date(calYear, calMonth, 0).getDate();

    let cells = [];

    for (let i = firstDow - 1; i >= 0; i--)
      cells.push({ day: prevTotal - i, other: true });

    for (let d = 1; d <= daysInMonth; d++) {
      const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push({ day: d, ds, other: false, isToday: ds === today, isSel: ds === sel });
    }

    const fill = Math.ceil(cells.length / 7) * 7 - cells.length;
    for (let i = 1; i <= fill; i++)
      cells.push({ day: i, other: true });

    const dayNames = DAYS.map(d => `<div class="cal-day-name">${d}</div>`).join('');

    const dayCells = cells.map(c => {
      if (c.other) return `<div class="cal-cell cal-other">${c.day}</div>`;
      let cls = 'cal-cell';
      if (c.isToday) cls += ' cal-today';
      if (c.isSel)   cls += ' cal-selected';
      return `<div class="${cls}" data-date="${c.ds}">${c.day}</div>`;
    }).join('');

    calEl.innerHTML = `
      <div class="cal-header">
        <button class="cal-nav" id="cal-prev">‹</button>
        <span class="cal-month-label">${MONTHS[calMonth]} ${calYear}</span>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div class="cal-grid">
        ${dayNames}
        ${dayCells}
      </div>
      <div class="cal-footer">
        ${sel
          ? `<button class="cal-clear-btn">Очистить дату</button>`
          : `<span class="cal-footer-hint">Нажмите на дату</span>`}
      </div>
    `;

    calEl.querySelector('#cal-prev').addEventListener('click', e => {
      e.stopPropagation();
      if (--calMonth < 0) { calMonth = 11; calYear--; }
      buildCal();
    });
    calEl.querySelector('#cal-next').addEventListener('click', e => {
      e.stopPropagation();
      if (++calMonth > 11) { calMonth = 0; calYear++; }
      buildCal();
    });

    calEl.querySelectorAll('.cal-cell:not(.cal-other)').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        setDeadline(calTaskId, el.dataset.date);
        closeCal();
      });
    });

    const clrBtn = calEl.querySelector('.cal-clear-btn');
    if (clrBtn) {
      clrBtn.addEventListener('click', e => {
        e.stopPropagation();
        setDeadline(calTaskId, null);
        closeCal();
      });
    }
  }

  function positionCal(anchor) {
    const r = anchor.getBoundingClientRect();
    const W = 256, H = 290;
    let left = r.left;
    let top  = r.bottom + 6;

    if (left + W > window.innerWidth  - 8) left = window.innerWidth  - W - 8;
    if (left < 8)                          left = 8;
    if (top  + H > window.innerHeight - 8) top  = r.top - H - 6;
    if (top  < 8)                          top  = 8;

    calEl.style.left = left + 'px';
    calEl.style.top  = top  + 'px';
  }

  function closeCal() {
    if (calEl) { calEl.remove(); calEl = null; }
    calTaskId = null;
  }

  // ── Event listeners ───────────────────────────────────────────

  formEl.addEventListener('submit', e => {
    e.preventDefault();
    add(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  addRow.addEventListener('click', () => inputEl.focus());

  clearBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  document.addEventListener('click', closeCal);

  // ── Init ──────────────────────────────────────────────────────

  if (tasks.length === 0) {
    const now  = new Date();
    const yest = new Date(now); yest.setDate(yest.getDate() - 1);
    const tom  = new Date(now); tom.setDate(tom.getDate() + 2);

    tasks = [
      { id: 4, text: 'Выпить стакан воды',        done: true,  deadline: toISO(now)  },
      { id: 3, text: 'Прочитать 20 страниц книги', done: false, deadline: toISO(tom)  },
      { id: 2, text: 'Ответить на письма',         done: false, deadline: toISO(now)  },
      { id: 1, text: 'Сделать зарядку',            done: false, deadline: toISO(yest) },
    ];
    save();
  }

  updateMeta();
  render();
</script>
</body>
</html>
